query SearchEnquiries($searchTerm: String, $limit: Int!, $offset: Int!) {
  enquiries(
    where: {_or: [{unique_text_id: {_ilike: $searchTerm}}, {notes: {_ilike: $searchTerm}}, {trader: {first_name: {_ilike: $searchTerm}}}, {trader: {last_name: {_ilike: $searchTerm}}}, {trader: {email: {_ilike: $searchTerm}}}, {trader: {phone: {_ilike: $searchTerm}}}, {trader: {external_id: {_ilike: $searchTerm}}}, {vessel: {name: {_ilike: $searchTerm}}}, {vessel: {imo: {_ilike: $searchTerm}}}, {port_of_supply: {name: {_ilike: $searchTerm}}}, {port_of_supply: {country: {_ilike: $searchTerm}}}, {enquiries_customers_onlink: {customer: {customer_name: {_ilike: $searchTerm}}}}, {enquiries_customers_onlink: {customer: {customer_address: {_ilike: $searchTerm}}}}, {enquiries_customers_onlink: {customer: {customer_contact_name: {_ilike: $searchTerm}}}}, {enquiries_customers_onlink: {customer: {customer_contact_email: {_ilike: $searchTerm}}}}, {enquiries_customers_onlink: {customer: {operational_contact_name: {_ilike: $searchTerm}}}}, {enquiries_customers_onlink: {customer: {operational_contact_email: {_ilike: $searchTerm}}}}, {enquiries_customers_onlink: {customer: {currency_for_credit_limit: {_ilike: $searchTerm}}}}, {enquiry_line_items_onlink: {product: {name: {_ilike: $searchTerm}}}}, {enquiry_line_items_onlink: {uom_of_supply: {_ilike: $searchTerm}}}]}
    limit: $limit
    offset: $offset
  ) {
    id
    unique_text_id
    status
    date_of_enquiry
    trader {
      nimbus_user_id
      first_name
      last_name
      email
      phone
      external_id
      __typename
    }
    vessel {
      id
      name
      imo
      status
      __typename
    }
    port_of_supply {
      id
      name
      country
      status
      __typename
    }
    duty_paid
    laycan_start_date
    laycan_end_date
    notes
    enquiries_customers_onlink {
      customer_id
      customer {
        id
        customer_name
        customer_address
        customer_contact_name
        customer_contact_number
        customer_contact_email
        operational_contact_name
        operational_contact_number
        operational_contact_email
        size
        credit_limit
        currency_for_credit_limit
        __typename
      }
      __typename
    }
    enquiry_line_items_onlink {
      id
      enquiry_id
      product_id
      specification_id
      uom_of_supply
      quantity_minimum
      quantity_maximum
      product {
        id
        name
        __typename
      }
      specification {
        id
        specification
        __typename
      }
      __typename
    }
    __typename
  }
}